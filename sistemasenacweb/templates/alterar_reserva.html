{% extends "base.html" %}

{% block title %}
Alterar Reserva
{% endblock %}

{% block menu %}

<a href="{{ url_for('professor') }}">
    Início
</a>

<a href="{{ url_for('professor_salas') }}">
    Salas
</a>

<a href="{{ url_for('professor_reservas') }}">
    Minhas Reservas
</a>

<a href="{{ url_for('logout') }}">
    Sair
</a>

{% endblock %}


{% block content %}

<div class="card">

    <h1>Alterar Reserva</h1>

    <p>
        Altere a data ou o período da sua reserva.
    </p>


    {% if mensagem %}

        <div class="mensagem-erro">
            {{ mensagem }}
        </div>

    {% endif %}


    <form
        method="POST"
        action="{{ url_for('alterar_reserva', indice=request.view_args.indice) }}"
    >

        <!-- INFORMAÇÕES DA RESERVA -->

        <div class="campo">

            <label>
                Sala
            </label>

            <input
                type="text"
                value="Sala {{ reserva.sala.numero }}"
                disabled
            >

        </div>


        <div class="campo">

            <label>
                Turma
            </label>

            <input
                type="text"
                value="{{ reserva.turma.nome }}"
                disabled
            >

        </div>


        <!-- DATA -->

        <div class="campo">

            <label for="data">
                Data
            </label>

            <input
                type="date"
                id="data"
                name="data"
                value="{{ reserva.data }}"
                required
            >

        </div>


        <!-- PERÍODO -->

        <div class="campo">

            <label for="horario">
                Período
            </label>

            <select
                id="horario"
                name="horario"
                required
            >

                <option value="">
                    Selecione um período
                </option>

                <option
                    value="Manhã"
                    {% if reserva.horario == "Manhã" %}
                        selected
                    {% endif %}
                >
                    Manhã — 08:00 às 12:00
                </option>

                <option
                    value="Tarde"
                    {% if reserva.horario == "Tarde" %}
                        selected
                    {% endif %}
                >
                    Tarde — 13:00 às 17:00
                </option>

                <option
                    value="Noite"
                    {% if reserva.horario == "Noite" %}
                        selected
                    {% endif %}
                >
                    Noite — 18:00 às 22:00
                </option>

            </select>

        </div>


        <!-- BOTÕES -->

        <button
            type="submit"
            class="botao"
        >
            Salvar Alterações
        </button>


        <a
            href="{{ url_for('professor_reservas') }}"
            class="botao botao-secundario"
        >
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
