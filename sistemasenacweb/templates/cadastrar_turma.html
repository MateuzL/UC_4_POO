{% extends "base.html" %}

{% block title %}
Cadastrar Turma
{% endblock %}

{% block menu %}

<a href="{{ url_for('coordenador') }}">Início</a> <a href="{{ url_for('consultar_turmas') }}">Turmas</a>

{% endblock %}

{% block content %}

<div class="card">


<h1>Cadastrar Turma</h1>

<p>Informe os dados da nova turma.</p>

{% if mensagem %}

    <div class="mensagem-erro">
        {{ mensagem }}
    </div>

{% endif %}

<form method="POST">

    <div class="campo">

        <label for="nome">
            Nome da turma
        </label>

        <input
            type="text"
            id="nome"
            name="nome"
            required
        >

    </div>

    <div class="campo">

        <label for="curso">
            Curso
        </label>

        <input
            type="text"
            id="curso"
            name="curso"
            required
        >

    </div>

    <div class="campo">

        <label for="quantidade">
            Quantidade de alunos
        </label>

        <input
            type="number"
            id="quantidade"
            name="quantidade"
            min="1"
            required
        >

    </div>

    <button
        type="submit"
        class="botao"
    >
        Cadastrar
    </button>

    <a
        href="{{ url_for('consultar_turmas') }}"
        class="botao botao-secundario"
    >
        Voltar
    </a>

</form>


</div>

{% endblock %}
