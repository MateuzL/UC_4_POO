{% extends "base.html" %}

{% block title %}
Cadastrar Sala
{% endblock %}


{% block menu %}

<a href="{{ url_for('coordenador') }}">
    Início
</a>

<a href="{{ url_for('coordenador') }}">
    Salas
</a>

<a href="#">
    Turmas
</a>

<a href="#">
    Reservas
</a>

{% endblock %}


{% block content %}

<div class="card">

    <h1>
        Cadastrar Sala
    </h1>

    <p>
        Informe os dados da nova sala.
    </p>


    {% if mensagem %}

        <div class="mensagem-erro">
            {{ mensagem }}
        </div>

    {% endif %}


    <form method="POST">

        <div class="campo">

            <label for="numero">
                Número da sala
            </label>

            <input
                type="text"
                id="numero"
                name="numero"
                placeholder="Ex: 101"
                required
            >

        </div>


        <div class="campo">

            <label for="capacidade">
                Capacidade
            </label>

            <input
                type="number"
                id="capacidade"
                name="capacidade"
                placeholder="Ex: 40"
                min="1"
                required
            >

        </div>


        <button
            type="submit"
            class="botao"
        >
            Cadastrar
        </button>


        <a
            href="{{ url_for('coordenador') }}"
            class="botao botao-secundario"
        >
            Voltar
        </a>

    </form>

</div>

{% endblock %}
