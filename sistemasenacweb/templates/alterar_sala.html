{% extends "base.html" %}

{% block title %}
Alterar Sala
{% endblock %}

{% block menu %}

<a href="{{ url_for('coordenador') }}">
    Início
</a>

<a href="{{ url_for('coordenador') }}">
    Salas
</a>

<a href="#">
    Turmas
</a>

<a href="#">
    Reservas
</a>

{% endblock %}

{% block content %}

<div class="card">


<h1>
    Alterar Sala
</h1>

<p>
    Altere a capacidade da sala.
</p>


{% if mensagem %}

    <div class="mensagem-erro">
        {{ mensagem }}
    </div>

{% endif %}


<form method="POST">

    <div class="campo">

        <label for="numero">
            Número da sala
        </label>

        <input
            type="text"
            id="numero"
            value="{{ sala.numero }}"
            disabled
        >

    </div>


    <div class="campo">

        <label for="capacidade">
            Capacidade
        </label>

        <input
            type="number"
            id="capacidade"
            name="capacidade"
            value="{{ sala.capacidade }}"
            min="1"
            required
        >

    </div>


    <button
        type="submit"
        class="botao"
    >
        Salvar Alterações
    </button>


    <a
        href="{{ url_for('coordenador') }}"
        class="botao botao-secundario"
    >
        Voltar
    </a>

</form>


</div>

{% endblock %}
