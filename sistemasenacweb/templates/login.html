<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Sistema Educacional
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body class="pagina-login">


    <div class="login-container">


        <!-- LADO ESQUERDO -->

        <div class="login-info">

            <div class="login-logo">
                Sistema Educacional
            </div>

            <h1>
                Bem-vindo!
            </h1>

            <p>
                Sistema de gerenciamento
                educacional para coordenadores
                e professores.
            </p>

        </div>


        <!-- LADO DIREITO -->

        <div class="login-card">

            <h2>
                Entrar
            </h2>

            <p class="login-subtitulo">
                Acesse sua conta para continuar.
            </p>


            {% if mensagem %}

                <div class="mensagem-erro">
                    {{ mensagem }}
                </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('login') }}"
            >


                <div class="campo-login">

                    <label for="login">
                        Login
                    </label>

                    <input
                        type="text"
                        id="login"
                        name="login"
                        placeholder="Digite seu login"
                        required
                    >

                </div>


                <div class="campo-login">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="botao-login"
                >
                    Entrar
                </button>


            </form>

        </div>

    </div>


    <footer class="rodape-login">

        <p>
            Sistema Educacional
        </p>

    </footer>


</body>

</html>
