{% extends 'base.html' %}{% block content %}<section class="panel"><div class="panel-title"><div><h2>Novo evento no auditório</h2><p>Cadastre apresentações, formaturas, palestras e reuniões.</p></div></div><form method="post" action="{{url_for('evento')}}" class="form-grid"><label>Título<input name="title" required></label><label>Tipo<select name="type"><option>Apresentação</option><option>Formatura</option><option>Palestra</option><option>Reunião</option><option>Outro</option></select></label><label>Data<input type="date" name="date" required></label><label>Horário<input name="time" placeholder="14h às 17h" required></label><label class="wide">Descrição<textarea name="description"></textarea></label><button>Cadastrar evento</button></form></section><section class="panel"><div class="panel-title"><h2>Eventos cadastrados</h2></div>{% for e in events %}<div class="event"><div class="event-icon">✦</div><div><b>{{e.title}}</b><p>{{e.date}} · {{e.time}} · Auditório</p><small>{{e.description}}</small></div><span class="badge">{{e.type}}</span></div>{% endfor %}</section>{% endblock %}
