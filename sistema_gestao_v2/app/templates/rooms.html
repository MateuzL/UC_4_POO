{% extends "base.html" %}{% block heading %}Salas{% endblock %}{% block content %}
<div class="panel"><h2>Nova sala</h2><form method="post" action="{{url_for('coord.create_room')}}" class="form-grid"><input name="name" placeholder="Nome da sala" required><input name="capacity" type="number" min="1" placeholder="Capacidade" required><button class="primary">Cadastrar</button></form></div>
<div class="panel"><h2>Salas cadastradas</h2><div class="table-wrap"><table><tr><th>Nome</th><th>Categoria</th><th>Capacidade</th><th>Status</th><th></th></tr>{% for r in rooms.values() %}<tr><td>{{r.name}}</td><td>{{r.category}}</td><td>{{r.capacity}}</td><td>{{"Ativa" if r.active else "Inativa"}}</td><td><form method="post" action="{{url_for('coord.toggle_room',room_id=r.id)}}"><button class="small secondary">{{"Desativar" if r.active else "Ativar"}}</button></form></td></tr>{% endfor %}</table></div></div>{% endblock %}
